{% extends "layout.html" %}
{% block content %}

<h2>Pieejamie pulciņi</h2>

{% for i in pulcini %}

<div class="card p-3 mb-2">
    <h4>{{ i.nosaukums }}</h4>
    <p>{{ i.apraksts }}</p>
    <p>Brīvas vietas - {{ i.vietas }}</p>

{% if i.id in mani %}
        <button class="btn btn-success">Tu jau esi pieteicies!</button>
{% else %}
    <form method="POST" action="/pievienoties">
        <input type="hidden" name="pulcins_id" value="{{ i.id }}">
        <button class="btn btn-primary">Pieteikties pulciņam</button>
    </form>
{% endif %}

</div>

{% endfor %}
{% endblock %}
