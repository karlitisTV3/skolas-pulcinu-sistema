{% extends "layout.html" %}
{% block content %}

<h2>Tavi pieteikumi</h2>

{% if pieteikumi %}
<ul>
{% for i in pieteikumi %}
    <li>
        {{i.nosaukums}}
        <form method="POST" action="/atteikties" style="display:inline;">
            <input type="hidden" name="pulcins_id" value="{{i.id}}">
            <button class="btn btn-danger btn-sm">Atteikties</button>
        </form>
    </li>
{% endfor %}
</ul>
{% else %}
<p>Nav pieteikumu</p>
{% endif %}

{% endblock %}
